<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>French Verb Review</title>
  <style>
    :root {
      --bg-color: #f1f5f9;
      --card-bg: #ffffff;
      --border-color: #cbd5e1;
      --text-main: #0f172a;
      --text-sub: #64748b;
      
      --accent-red: #ef4444;
      --accent-orange: #f97316;
      --accent-blue: #3b82f6;
      --accent-green: #10b981;

      --shadow-sm: 0 1px 3px rgba(0,0,0,0.05);
      --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.08);
      --border-radius: 12px;
    }

    * {
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: var(--bg-color);
      color: var(--text-main);
      margin: 0;
      padding: 15px;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
    }

    .container {
      width: 100%;
      max-width: 440px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    header {
      text-align: center;
    }

    h1 {
      margin: 0;
      font-size: 1.1rem;
      font-weight: 700;
      color: var(--text-main);
    }

    .stats-bar {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
    }

    .stat-card {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      padding: 6px 10px;
      border-radius: 8px;
      box-shadow: var(--shadow-sm);
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .stat-label {
      font-size: 0.7rem;
      font-weight: 600;
      color: var(--text-sub);
    }

    .stat-value {
      font-size: 1rem;
      font-weight: 700;
      margin-top: 2px;
    }

    .due-count { color: var(--accent-orange); }
    .new-count { color: var(--accent-blue); }
    .mastered-count { color: var(--accent-green); }

    .controls {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
    }

    select, button.action-btn {
      appearance: none;
      -webkit-appearance: none;
      padding: 6px 10px;
      border-radius: 6px;
      border: 1px solid var(--border-color);
      background: var(--card-bg);
      font-size: 0.8rem;
      font-weight: 500;
      color: var(--text-main);
      cursor: pointer;
      outline: none;
      transition: all 0.15s ease;
    }

    select {
      background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%2364748b' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3e%3cpolyline points='6 9 12 15 18 9'%3e%3c/polyline%3e%3c/svg%3e");
      background-repeat: no-repeat;
      background-position: right 8px center;
      background-size: 12px;
      padding-right: 26px;
    }

    button.action-btn:hover, select:hover {
      background-color: #f8fafc;
      border-color: #94a3b8;
    }

    button.btn-notebook {
      color: var(--accent-red);
      border-color: rgba(239, 68, 68, 0.4);
    }

    .card-area {
      width: 100%;
      min-height: 240px;
    }

    .card {
      width: 100%;
      height: 100%;
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: var(--border-radius);
      box-shadow: var(--shadow-md);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      position: relative;
      padding: 24px 16px 28px 16px;
      cursor: pointer;
      user-select: none;
      text-align: center;
    }

    .tag-badge {
      position: absolute;
      top: 12px;
      left: 12px;
      padding: 3px 8px;
      border-radius: 4px;
      font-size: 0.65rem;
      font-weight: 700;
      color: white;
    }

    .bg-High_Frequency_Core { background: #ef4444; }
    .bg-Common_Intermediate { background: #3b82f6; }
    .bg-Basic_Expansion { background: #475569; }

    .tts-btn {
      position: absolute;
      top: 10px;
      right: 12px;
      background: #f1f5f9;
      border: 1px solid #e2e8f0;
      width: 28px;
      height: 28px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.85rem;
      cursor: pointer;
      transition: background 0.15s;
    }

    .tts-btn:hover {
      background: #e2e8f0;
    }

    .word-french {
      font-size: 1.5rem;
      font-weight: 700;
      color: var(--text-main);
      margin-bottom: 6px;
    }

    .word-english {
      font-size: 1.1rem;
      color: var(--accent-green);
      font-weight: 600;
      min-height: 1.5rem;
      margin-bottom: 8px;
    }

    .word-example-container {
      max-width: 92%;
      padding: 8px 10px;
      background: #f8fafc;
      border-radius: 6px;
      border-left: 3px solid var(--accent-blue);
      margin-top: 4px;
      margin-bottom: 12px;
      text-align: left;
    }

    .word-example-fr {
      font-size: 0.82rem;
      color: var(--text-main);
      font-style: italic;
      line-height: 1.35;
      font-weight: 500;
    }

    .word-example-en {
      font-size: 0.75rem;
      color: var(--text-sub);
      margin-top: 3px;
      line-height: 1.3;
    }

    .hint-text {
      position: absolute;
      bottom: 10px;
      color: var(--text-sub);
      font-size: 0.75rem;
    }

    .action-buttons {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 6px;
      width: 100%;
    }

    .btn-rating {
      padding: 8px 4px;
      border: none;
      border-radius: 6px;
      color: white;
      font-weight: 600;
      font-size: 0.8rem;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
      box-shadow: var(--shadow-sm);
    }

    .btn-rating span.interval {
      font-size: 0.65rem;
      font-weight: 400;
      opacity: 0.9;
    }

    .btn-again { background: #ef4444; }
    .btn-hard { background: #f97316; }
    .btn-good { background: #3b82f6; }
    .btn-easy { background: #10b981; }

    .hidden {
      display: none !important;
    }

    .empty-state {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: var(--border-radius);
      padding: 30px;
      text-align: center;
      box-shadow: var(--shadow-sm);
    }

    .empty-state h2 {
      margin-top: 0;
      font-size: 1.1rem;
      color: var(--text-main);
    }

    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(0, 0, 0, 0.3);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 1000;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.15s ease;
    }

    .modal-overlay.active {
      opacity: 1;
      pointer-events: auto;
    }

    .modal {
      background: #ffffff;
      width: 90%;
      max-width: 400px;
      max-height: 70vh;
      border-radius: 12px;
      box-shadow: var(--shadow-md);
      border: 1px solid var(--border-color);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .modal-header {
      padding: 12px 16px;
      border-bottom: 1px solid #f1f5f9;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .modal-header h2 {
      margin: 0;
      font-size: 0.95rem;
      font-weight: 700;
      color: var(--text-main);
    }

    .close-btn {
      background: transparent;
      border: none;
      font-size: 1.2rem;
      cursor: pointer;
      color: var(--text-sub);
    }

    .modal-body {
      padding: 8px 16px;
      overflow-y: auto;
      flex: 1;
    }

    .mistake-list {
      list-style: none;
      padding: 0;
      margin: 0;
    }

    .mistake-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 0;
      border-bottom: 1px solid #f1f5f9;
    }

    .mistake-item:last-child {
      border-bottom: none;
    }

    .mistake-info {
      display: flex;
      flex-direction: column;
    }

    .mistake-fr {
      font-weight: 700;
      color: var(--text-main);
      font-size: 0.9rem;
    }

    .mistake-en {
      font-size: 0.75rem;
      color: var(--text-sub);
    }

    .mistake-badge {
      font-size: 0.7rem;
      background: #fef2f2;
      color: var(--accent-red);
      border: 1px solid rgba(239, 68, 68, 0.2);
      padding: 2px 6px;
      border-radius: 4px;
      font-weight: 600;
    }

    .modal-footer {
      padding: 10px 16px;
      border-top: 1px solid #f1f5f9;
      display: flex;
      justify-content: flex-end;
      background: #f8fafc;
    }
  </style>
</head>
<body>

<div class="container">
  <header>
    <h1>French Verb Review</h1>
  </header>

  <div class="stats-bar">
    <div class="stat-card">
      <span class="stat-label">To Review</span>
      <span id="due-count" class="stat-value due-count">0</span>
    </div>
    <div class="stat-card">
      <span class="stat-label">New Cards</span>
      <span id="new-count" class="stat-value new-count">0</span>
    </div>
    <div class="stat-card">
      <span class="stat-label">Mastered</span>
      <span id="mastered-count" class="stat-value mastered-count">0</span>
    </div>
  </div>

  <div class="controls">
    <select id="tag-filter">
      <option value="ALL">All Groups</option>
      <option value="High_Frequency_Core">High Frequency Core</option>
      <option value="Common_Intermediate">Common Intermediate</option>
      <option value="Basic_Expansion">Basic Expansion</option>
    </select>
    <button class="action-btn btn-notebook" id="open-notebook-btn">Review List (<span id="notebook-count">0</span>)</button>
    <button class="action-btn" id="reset-btn">Reset</button>
  </div>

  <div id="card-area" class="card-area">
    <div class="card" id="flashcard">
      <span class="tag-badge" id="card-tag">Tag</span>
      <button class="tts-btn" id="tts-btn" title="Listen Pronunciation">🔊</button>
      <div class="word-french" id="card-french">Loading...</div>
      <div class="word-english hidden" id="card-english">Meaning</div>
      
      <div class="word-example-container hidden" id="card-example-box">
        <div class="word-example-fr" id="card-example-fr"></div>
        <div class="word-example-en" id="card-example-en"></div>
      </div>
      
      <div class="hint-text" id="hint-text">Click or press [Space] to show meaning</div>
    </div>
  </div>

  <div id="empty-area" class="empty-state hidden">
    <h2>Review Finished for Today</h2>
    <p style="color: var(--text-sub); margin: 0; font-size: 0.85rem;">No cards due for review under the selected group.</p>
  </div>

  <div class="action-buttons hidden" id="rating-controls">
    <button class="btn-rating btn-again" data-quality="1">
      Again (1)
      <span class="interval">&lt; 1 min</span>
    </button>
    <button class="btn-rating btn-hard" data-quality="2">
      Hard (2)
      <span class="interval" id="int-hard">1d</span>
    </button>
    <button class="btn-rating btn-good" data-quality="3">
      Good (3)
      <span class="interval" id="int-good">2d</span>
    </button>
    <button class="btn-rating btn-easy" data-quality="4">
      Easy (4)
      <span class="interval" id="int-easy">4d</span>
    </button>
  </div>
</div>

<div class="modal-overlay" id="notebook-modal">
  <div class="modal">
    <div class="modal-header">
      <h2>Review List</h2>
      <button class="close-btn" id="close-modal-btn">&times;</button>
    </div>
    <div class="modal-body">
      <ul class="mistake-list" id="mistake-list-container"></ul>
    </div>
    <div class="modal-footer">
      <button class="action-btn" id="close-modal-footer-btn">Close</button>
    </div>
  </div>
</div>

const LOCAL_STORAGE_KEY = "anki_french_verbs_data";

let cards = [];
let currentCard = null;
let isAnswerRevealed = false;

function initializeData() {
  const savedData = localStorage.getItem(LOCAL_STORAGE_KEY);
  if (savedData) {
    cards = JSON.parse(savedData);
  } else {
    cards = rawData.map((item, index) => ({
      id: index,
      french: item[0],
      english: item[1],
      tag: item[2],
      exampleFr: item[3] || "",
      exampleEn: item[4] || "",
      interval: 0,
      repetitions: 0,
      easeFactor: 2.5,
      dueDate: Date.now(),
      againCount: 0
    }));
    saveState();
  }
}

function saveState() {
  localStorage.setItem(LOCAL_STORAGE_KEY, JSON.stringify(cards));
}

function speakFrench(text) {
  if (!('speechSynthesis' in window)) return;
  const cleanText = text.replace(/\//g, " ou ");
  window.speechSynthesis.cancel();
  const utterance = new SpeechSynthesisUtterance(cleanText);
  utterance.lang = 'fr-FR';
  utterance.rate = 0.9;
  
  const voices = window.speechSynthesis.getVoices();
  const frVoice = voices.find(v => v.lang.startsWith('fr'));
  if (frVoice) {
    utterance.voice = frVoice;
  }
  
  window.speechSynthesis.speak(utterance);
}

function calculateNextReview(card, quality) {
  let { interval, repetitions, easeFactor, againCount = 0 } = card;

  if (quality === 1) {
    againCount += 1;
  }

  if (quality >= 3) {
    if (repetitions === 0) {
      interval = 1;
    } else if (repetitions === 1) {
      interval = 6;
    } else {
      interval = Math.round(interval * easeFactor);
    }
    repetitions++;
  } else {
    repetitions = 0;
    interval = 1;
  }

  easeFactor = easeFactor + (0.1 - (5 - quality) * (0.08 + (5 - quality) * 0.02));
  if (easeFactor < 1.3) easeFactor = 1.3;

  const dayInMs = 24 * 60 * 60 * 1000;
  const nextDueDate = Date.now() + (quality === 1 ? 60 * 1000 : interval * dayInMs);

  return {
    ...card,
    interval,
    repetitions,
    easeFactor,
    againCount,
    dueDate: nextDueDate
  };
}

function getIntervalText(card, quality) {
  if (quality === 1) return "< 1 min";
  const updated = calculateNextReview(card, quality);
  return `${updated.interval}d`;
}

function getDueCards() {
  const selectedTag = document.getElementById("tag-filter").value;
  const now = Date.now();
  return cards.filter(card => {
    const matchTag = (selectedTag === "ALL" || card.tag === selectedTag);
    return matchTag && card.dueDate <= now;
  });
}

function updateStats() {
  const selectedTag = document.getElementById("tag-filter").value;
  const filteredCards = cards.filter(c => selectedTag === "ALL" || c.tag === selectedTag);
  
  const now = Date.now();
  const due = filteredCards.filter(c => c.dueDate <= now).length;
  const newCards = filteredCards.filter(c => c.repetitions === 0).length;
  const mastered = filteredCards.filter(c => c.repetitions > 3).length;
  const mistakes = filteredCards.filter(c => (c.againCount > 0 || c.repetitions === 0) && c.repetitions <= 3).length;

  document.getElementById("due-count").innerText = due;
  document.getElementById("new-count").innerText = newCards;
  document.getElementById("mastered-count").innerText = mastered;
  document.getElementById("notebook-count").innerText = mistakes;
}

function loadNextCard() {
  isAnswerRevealed = false;
  const dueCards = getDueCards();
  
  updateStats();

  if (dueCards.length === 0) {
    document.getElementById("card-area").classList.add("hidden");
    document.getElementById("rating-controls").classList.add("hidden");
    document.getElementById("empty-area").classList.remove("hidden");
    currentCard = null;
    return;
  }

  document.getElementById("card-area").classList.remove("hidden");
  document.getElementById("empty-area").classList.add("hidden");
  document.getElementById("rating-controls").classList.add("hidden");

  currentCard = dueCards[Math.floor(Math.random() * dueCards.length)];

  document.getElementById("card-french").innerText = currentCard.french;
  document.getElementById("card-english").innerText = currentCard.english;
  document.getElementById("card-english").classList.add("hidden");
  
  const exampleBox = document.getElementById("card-example-box");
  exampleBox.classList.add("hidden");
  document.getElementById("card-example-fr").innerText = "";
  document.getElementById("card-example-en").innerText = "";
  
  const tagBadge = document.getElementById("card-tag");
  tagBadge.innerText = currentCard.tag.replace(/_/g, " ");
  tagBadge.className = `tag-badge bg-${currentCard.tag}`;
  
  document.getElementById("hint-text").innerText = "Click or press [Space] to show meaning";

  speakFrench(currentCard.french);
}

function revealAnswer() {
  if (!currentCard || isAnswerRevealed) return;
  isAnswerRevealed = true;

  document.getElementById("card-english").classList.remove("hidden");
  document.getElementById("hint-text").innerText = "Select rating (1-4)";
  document.getElementById("rating-controls").classList.remove("hidden");

  document.getElementById("int-hard").innerText = getIntervalText(currentCard, 2);
  document.getElementById("int-good").innerText = getIntervalText(currentCard, 3);
  document.getElementById("int-easy").innerText = getIntervalText(currentCard, 4);

  if (currentCard.exampleFr) {
    const exampleBox = document.getElementById("card-example-box");
    document.getElementById("card-example-fr").innerText = `Ex: ${currentCard.exampleFr}`;
    document.getElementById("card-example-en").innerText = currentCard.exampleEn ? `(${currentCard.exampleEn})` : "";
    exampleBox.classList.remove("hidden");
  }
}

function handleRating(quality) {
  if (!currentCard) return;

  const updatedCard = calculateNextReview(currentCard, quality);
  const index = cards.findIndex(c => c.id === currentCard.id);
  if (index !== -1) {
    cards[index] = updatedCard;
    saveState();
  }

  loadNextCard();
}

function renderNotebook() {
  const selectedTag = document.getElementById("tag-filter").value;
  const container = document.getElementById("mistake-list-container");
  container.innerHTML = "";

  const mistakeCards = cards.filter(c => {
    const matchTag = (selectedTag === "ALL" || c.tag === selectedTag);
    const isUnmastered = (c.againCount > 0 || c.repetitions === 0) && c.repetitions <= 3;
    return matchTag && isUnmastered;
  });

  if (mistakeCards.length === 0) {
    container.innerHTML = '<li style="text-align:center; color:#64748b; padding:16px;">No vocabulary items to consolidate.</li>';
    return;
  }

  mistakeCards.sort((a, b) => (b.againCount || 0) - (a.againCount || 0));

  mistakeCards.forEach(item => {
    const li = document.createElement("li");
    li.className = "mistake-item";
    li.innerHTML = `
      <div class="mistake-info">
        <span class="mistake-fr">${item.french}</span>
        <span class="mistake-en">${item.english}</span>
      </div>
      <span class="mistake-badge">Again: ${item.againCount || 0} times</span>
    `;
    container.appendChild(li);
  });
}

document.getElementById("flashcard").addEventListener("click", (e) => {
  if (e.target.id === "tts-btn") return;
  if (!isAnswerRevealed) {
    revealAnswer();
  } else {
    speakFrench(currentCard.french);
  }
});

document.getElementById("tts-btn").addEventListener("click", (e) => {
  e.stopPropagation();
  if (currentCard) {
    speakFrench(currentCard.french);
  }
});

document.querySelectorAll(".btn-rating").forEach(btn => {
  btn.addEventListener("click", () => {
    const quality = parseInt(btn.getAttribute("data-quality"));
    handleRating(quality);
  });
});

document.getElementById("tag-filter").addEventListener("change", () => {
  loadNextCard();
});

document.getElementById("reset-btn").addEventListener("click", () => {
  if (confirm("Are you sure you want to reset your learning progress?")) {
    localStorage.removeItem(LOCAL_STORAGE_KEY);
    initializeData();
    loadNextCard();
  }
});

const modal = document.getElementById("notebook-modal");
document.getElementById("open-notebook-btn").addEventListener("click", () => {
  renderNotebook();
  modal.classList.add("active");
});

const closeModal = () => modal.classList.remove("active");
document.getElementById("close-modal-btn").addEventListener("click", closeModal);
document.getElementById("close-modal-footer-btn").addEventListener("click", closeModal);
modal.addEventListener("click", (e) => {
  if (e.target === modal) closeModal();
});

document.addEventListener("keydown", (e) => {
  if (modal.classList.contains("active")) return;

  if (e.code === "Space") {
    e.preventDefault();
    if (!isAnswerRevealed) {
      revealAnswer();
    } else if (currentCard) {
      speakFrench(currentCard.french);
    }
  } else if (isAnswerRevealed) {
    if (e.key === "1") handleRating(1);
    if (e.key === "2") handleRating(2);
    if (e.key === "3") handleRating(3);
    if (e.key === "4") handleRating(4);
  }
});

if ('speechSynthesis' in window) {
  window.speechSynthesis.onvoiceschanged = () => {
    window.speechSynthesis.getVoices();
  };
}

initializeData();
loadNextCard();
</script>
